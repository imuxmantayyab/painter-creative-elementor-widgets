<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" fill="none">
  <!-- Option 1: Straight Handle with Classic Square Arm (Photo Reference) -->
  <g class="ute-roller-svg-group">
    <!-- Roller Sleeve (Wet Paint Cylinder) -->
    <rect class="ute-roller-sleeve" x="6" y="26" width="56" height="184" rx="10" fill="var(--ute-roller-sleeve, #FF5E4D)" />
    
    <!-- Sleeve 3D Volume Highlight & Shadow -->
    <rect x="14" y="30" width="10" height="176" rx="5" fill="#ffffff" opacity="0.25" />
    <rect x="52" y="30" width="8" height="176" rx="4" fill="#000000" opacity="0.14" />
    
    <!-- Sleeve End Caps -->
    <ellipse class="ute-roller-sleeve ute-roller-cap" cx="34" cy="28" rx="26" ry="5" fill="var(--ute-roller-sleeve, #FF5E4D)" stroke="var(--ute-roller-cap-color, var(--ute-roller-sleeve, #FF5E4D))" stroke-width="1.8" />
    <ellipse class="ute-roller-sleeve ute-roller-cap" cx="34" cy="208" rx="26" ry="5" fill="var(--ute-roller-sleeve, #FF5E4D)" stroke="var(--ute-roller-cap-color, var(--ute-roller-sleeve, #FF5E4D))" stroke-width="1.8" />
    
    <!-- Bottom Paint Bead / Excess Corner Lip (Matching Grid Reference) -->
    <path d="M 44,210 C 44,217 48,221 52,221 C 56,221 58,217 58,210 Z" fill="#BF3928" opacity="0.75" />

    <!-- Flared Collar / Bushing Bracket on Top Sleeve -->
    <path d="M 22,27 C 24,22 28,18 31,17 L 37,17 C 40,18 44,22 46,27 Z" fill="#586070" />

    <!-- Square Metal Wire Arm -->
    <path d="M 34,24 
             L 34,16 
             C 34,10 39,6 46,6 
             L 72,6 
             C 79,6 83,10 83,17 
             L 83,138 
             C 83,144 87,149 93,149 
             L 120,149" 
          stroke="var(--ute-roller-frame, #8C96A8)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />

    <!-- Metal Arm Chrome Highlight -->
    <path d="M 34,23 
             L 34,16 
             C 34,11 38,8 45,8 
             L 72,8 
             C 78,8 81,11 81,17 
             L 81,138 
             C 81,143 85,147 93,147 
             L 120,147" 
          stroke="#ffffff" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" 
          opacity="0.48" />

    <!-- Dark Metal Underside Reflection -->
    <line x1="38" y1="10" x2="68" y2="10" stroke="#48505E" stroke-width="2" stroke-linecap="round" opacity="0.4" />

    <!-- Straight Handle Grip (Clean, Straight, Non-Edged Cylindrical Profile) -->
    <g class="ute-roller-handle-wrap">
      <!-- Handle Body: Perfectly straight top and bottom with rounded bullnose dome -->
      <path d="M 116,133 
               L 194,133 
               C 204,133 213,140 213,149 
               C 213,158 204,165 194,165 
               L 116,165 
               C 114,165 112,163 112,160 
               L 112,138 
               C 112,135 114,133 116,133 Z" 
            fill="var(--ute-roller-handle, #2B4CFF)" />

      <!-- Top Subtle Light Reflection -->
      <line x1="118" y1="137" x2="194" y2="137" 
            stroke="#ffffff" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            opacity="0.32" />

      <!-- Hanging Eyelet Hole (Near End) -->
      <circle cx="194" cy="149" r="4.5" fill="#0B1333" />
      <path d="M 191,152 C 193,154 196,154 197,152" stroke="#ffffff" stroke-width="0.8" opacity="0.25" fill="none" />
    </g>
  </g>
</svg>
