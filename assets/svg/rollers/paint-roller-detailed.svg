<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Paint Roller Assembly Matching Reference -->
  <g class="ute-roller-svg-group">
    <!-- Roller Sleeve (Wet Paint Cylinder) -->
    <rect class="ute-roller-sleeve" x="8" y="28" width="48" height="175" rx="8" ry="8" fill="var(--ute-roller-sleeve, #FF5E4D)" />
    <!-- Sleeve Highlights & Shadows for 3D Paint Effect -->
    <rect x="14" y="32" width="8" height="167" rx="4" fill="#ffffff" opacity="0.22" />
    <rect x="46" y="32" width="6" height="167" rx="3" fill="#000000" opacity="0.15" />
    <!-- Sleeve End Caps -->
    <ellipse class="ute-roller-sleeve ute-roller-cap" cx="32" cy="30" rx="22" ry="4" fill="var(--ute-roller-sleeve, #FF5E4D)" stroke="var(--ute-roller-cap-color, var(--ute-roller-sleeve, #FF5E4D))" stroke-width="2" />
    <ellipse class="ute-roller-sleeve ute-roller-cap" cx="32" cy="201" rx="22" ry="4" fill="var(--ute-roller-sleeve, #FF5E4D)" stroke="var(--ute-roller-cap-color, var(--ute-roller-sleeve, #FF5E4D))" stroke-width="2" />

    <!-- Metal Spindle / Wire Arm -->
    <!-- Top stem emerging from roller core -->
    <line x1="32" y1="28" x2="32" y2="16" stroke="var(--ute-roller-frame, #8C96A8)" stroke-width="6" stroke-linecap="round" />
    <!-- Top curve turning right -->
    <path d="M 32,16 C 32,12 36,9 42,9 L 66,9 C 74,9 78,13 78,21 L 78,110 C 78,118 74,124 66,124 L 62,124 C 54,124 50,128 50,136 L 50,148 C 50,154 54,158 60,158 L 94,158" 
          stroke="var(--ute-roller-frame, #8C96A8)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Metal Arm Highlights -->
    <path d="M 33,17 C 33,14 36,11 42,11 L 66,11 C 72,11 76,14 76,21 L 76,110 C 76,116 72,122 66,122 L 62,122 C 55,122 52,126 52,136 L 52,148 C 52,153 55,156 60,156 L 94,156" 
          stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />

    <!-- Handle & Ergonomic Grip -->
    <g class="ute-roller-handle-wrap">
      <!-- Handle Collar / Ferrule -->
      <rect x="94" y="150" width="10" height="16" rx="2" fill="var(--ute-roller-frame, #727C8F)" />
      <!-- Main Blue Grip -->
      <path d="M 104,149 
               C 114,147 132,146 152,145 
               C 172,144 186,148 190,155 
               C 193,160 193,162 190,167 
               C 186,174 172,178 152,177 
               C 132,176 114,175 104,173 
               C 100,172 98,168 98,161 
               C 98,154 100,150 104,149 Z" 
            fill="var(--ute-roller-handle, #2B4CFF)" />
      <!-- Handle Highlight -->
      <path d="M 108,153 C 122,151 146,150 176,151" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" />
      <!-- Handle Grip Indentations -->
      <line x1="126" y1="154" x2="126" y2="168" stroke="var(--ute-roller-grip, #182C9E)" stroke-width="2" stroke-linecap="round" />
      <line x1="138" y1="154" x2="138" y2="168" stroke="var(--ute-roller-grip, #182C9E)" stroke-width="2" stroke-linecap="round" />
      <line x1="150" y1="154" x2="150" y2="168" stroke="var(--ute-roller-grip, #182C9E)" stroke-width="2" stroke-linecap="round" />
      <!-- Hanging Hole -->
      <circle cx="180" cy="161" r="3.5" fill="#0B1333" />
    </g>
  </g>
</svg>
